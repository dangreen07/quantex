name: Deploy Docs

on:
  push:
    branches: [ main ]  # adjust if default branch is different
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # MkDocs supports 3.8+

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # Install project & dev dependencies required to build docs
          poetry install --with dev --no-interaction --no-root

      - name: Build documentation
        run: |
          poetry run mkdocs build --strict --clean

      # Upload the generated site as an artifact for the deploy-pages action
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v3 