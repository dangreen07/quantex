site_name: QuantEx
site_description: Documentation for QuantEx
extra_css:
  - stylesheets/pdf-overrides.css
theme:
  name: material
  palette:
    # Scheme can be 'default' (light) or 'slate' (dark)
    # You can also define specific light/dark palettes
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal # Example: Change the primary color (header, links)
      accent: deep orange # Example: Change the accent color (highlight)
      toggle:
        icon: material/brightness-4 # Icon for light mode
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate # Or 'default' for a dark scheme
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7 # Icon for dark mode
        name: Switch to light mode
nav:
  - Home: index.md
plugins:
  - search
  - to-pdf
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
            - ./src
          options:
            docstring_style: google
            show_source: false
  - mermaid2
  - print-site
